<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> q8</title>
    <style>
        body{
            margin: 0;
            
        }
        .bgimg{
            position: relative;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXxTjVxoEH6xwi811c0qA8C4lQgxlrkAnCvCtp1TfaMQ&s");
            background-size: cover;
            background-repeat: no-repeat;
            height: 100vh;
            padding: 10px;
        }
        .box1{
            position: absolute;
            top: 50%;
            left: 20%;
            width: 400px;
            height: 100px;
            background-color: antiquewhite;
            border: 2px solid black;
        }
        .box2{
            position: fixed;
            padding: 20px;
            top: 30%;
            left: 30%;
            width: 30px;
            height: 30px;
            background-color: red;

        }
        
    </style>
</head>
<body>
    <div class="bgimg"><p>this is relative</p>
        <div class="box1">this is absolute</div>
    </div>

    <div class="box2">fixed

    </div>
</body>
</html>
