<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>q21</title>

    <style>

        body {
            margin: 0;
           
        }

        

        .container {
            display: flex;
            flex-direction: row;

            justify-content: space-evenly;
            align-items: center;

            height: 500px;
            background-color: lightgray;
        }


      

        .box1 {
            width: 150px;
            height: 100px;
            background-color: red;

            color: white;
            text-align: center;
        }

      .box2 {
            width: 150px;
            height: 200px;
            background-color: blue;

            color: white;
            text-align: center;
        }




        .box3 {
            width: 150px;
            height: 300px;
            background-color: green;

            color: white;
            text-align: center;
        }



        @media (max-width: 600px) {

            .container {
                flex-direction: column;

                height: auto;
                padding: 20px 0;
                gap: 20px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="box1">
            <h2>Box 1</h2>
        </div>

        <div class="box2">
            <h2>Box 2</h2>
        </div>

        <div class="box3">
            <h2>Box 3</h2>
        </div>

    </div>
</body>
</html>
