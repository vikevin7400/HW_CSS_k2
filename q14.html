<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>q14</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            background-color: blue;
            background-image: url("https://cdn.photoroom.com/v2/image-cache?path=gs://background-7ef44.appspot.com/backgrounds_v3/nice/34_nice.jpg");

            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }



        h1 {
            color: black;
            font-size: 50px;
            text-align: left;
            display: block;
        }


        h2 {
            color: white;
            font-size: 50px;
            text-align: right;
            display: none;
        }


        @media (orientation: portrait) {

            body {
                background-image: url("https://img.magnific.com/free-photo/3d-rendering-hexagonal-texture-background_23-2150796421.jpg?semt=ais_test_b&w=740&q=80");

                background-repeat: no-repeat;
                background-size: cover;
                background-position: center;
            }

            h1 {
                display: none;
            }

            h2 {
                display: block;
            }

        }

    </style>
</head>

<body>

    <h1>Landscape</h1>

    <h2>Portrait</h2>

</body>

</html>
