<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> q5cont</title>

    <style>

        .main-box {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;

            border: 5px solid black;
            outline: 3px dashed gray;
            padding: 30px;
            margin: 30px;
        }

        .box1 {
            background-color: red;

            width: 100px;
            height: 100px;

            padding: 10px;
            margin: 10px;

            border: 5px solid black;
            outline: 4px solid yellow;
            
        }

        .box2 {
            background-color: blue;

            width: 150px;
            height: 120px;

            padding: 20px;
            margin: 20px;

            border: 8px dashed white;
            outline: 5px dashed black;
        }

        .box3 {
            background-color: green;

            width: 200px;
            height: 150px;

            padding: 40px;
            margin: 30px;

            border: 10px dotted blue;
            outline: 6px dotted red;
        }

    </style>

</head>

<body>

    <div class="main-box">

        <div class="box1">
            <h2>Box 1</h2>
        </div>

        <div class="box2">
            <h2>Box 2</h2>
        </div>

        <div class="box3">
            <h2>Box 3</h2>
        </div>

    </div>

</body>

</html>
