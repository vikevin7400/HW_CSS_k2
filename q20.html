<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>  q20
    </title>

    <style>

        body {
            margin: 0%;
        }


        

        nav {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;

            background-color: black;
            padding: 20px;
        }

        a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }


        

        .hero {
            background-image: url("https://images.unsplash.com/photo-1610465299993-e6675c9f9efa?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8bGFwdG9wJTIwd2FsbHBhcGVyJTIwaGR8ZW58MHx8MHx8fDA%3D");
            background-size: cover;
            background-position: center;

            height: 500px;

            color: white;
            text-align: center;

            padding-top: 50px;

            position: relative;
        }


        

        h1 {
            font-size: 50px;
        }


        

        p {
            font-size: 20px;
        }



        button {
            position: absolute;

            top: 60%;
            left: 45%;

            padding: 15px 25px;
            font-size: 18px;

            background-color: orange;
            border: none;
            border-radius: 5px;
        }



        @media (max-width: 600px) {

            .hero {

             

                background-image: url("https://m.media-amazon.com/images/S/aplus-media-library-service-media/ffd06dce-5656-4550-8d5c-a5798868ad88.__CR0,0,4392,1800_PT0_SX1464_V1___.jpg");

                height: 600px;
            }


     

            nav {
                flex-direction: column;
                gap: 15px;
            }

        }

    </style>

</head>

<body>
    <nav>

        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Services</a>
        <a href="">Contact</a>

    </nav>

    <section class="hero">

        <h1>Explore the World</h1>

        <p>
            Discover beautiful places and create
            unforgettable memories.
        </p>

        <button>Explore Now</button>

    </section>
</body>
</html>
