<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> q16</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: lightgray;
        }

        nav {
            background-color: blueviolet;
            padding: 20px;
            display: flex;
            justify-content: space-evenly;
        }
        a {
            color: white;
            text-decoration: none;
        }
        .profile {
            background-color: white;
            margin: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .cards {
            margin: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            width: 200px;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .profile {
                flex-direction: column;
                text-align: center;
            }

            .cards {
                flex-direction: column;
                align-items: center;
            }

        }

    </style>

</head>

<body>   
    <header>
    <nav>
        <a href="">Dashboard</a>
        <a href="">Courses</a>
        <a href="">Assignments</a>
        <a href="">Results</a>
        <a href="">Logout</a>
    </nav>
    </header>

    <section class="profile">

        <img src="https://d22e6o9mp4t2lx.cloudfront.net/cms/Screenshot_2024_04_05_130256_473f8428ec.png" alt="profile-picture" height="100px" width="100px">
        <div>

            <h2>Vinayak Varma</h2>

            <p>Student</p>

            <p>BSc IT Graduate</p>

        </div>

    </section>



    <section class="cards">

        <div class="card">

            <h2>Courses</h2>

            <p>5 Active Courses</p>

        </div>


        <div class="card">

            <h2>Assignments</h2>

            <p>3 Pending Assignments</p>

        </div>


        <div class="card">

            <h2>Attendance</h2>

            <p>85% Attendance</p>

        </div>


        <div class="card">

            <h2>Results</h2>

            <p>Average: 80%</p>

        </div>

    </section>


</body>

</html>
