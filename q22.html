<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>q22</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background-image: url("https://images.unsplash.com/photo-1610465299993-e6675c9f9efa?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8bGFwdG9wJTIwd2FsbHBhcGVyJTIwaGR8ZW58MHx8MHx8fDA%3D");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.5);
            width: 350px;
            
            padding: 30px;
            margin-top: 100px;

            border: 2px solid black;
            border-radius: 10px;
            position: relative;
            text-align: center;
        }


         h1 {
            font-family: Georgia, serif;
            font-size: 35px;
            font-weight: bold;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
        }


        form {
            display: flex;
            flex-direction: column;
        }


        label {
            font-size: 18px;
            font-weight: bold;
            text-align: left;
            margin-top: 15px;
            margin-bottom: 5px;
        }


        input {
            padding: 12px;

            border: 1px solid gray;
            border-radius: 5px;

            font-size: 16px;
        }

        button {
            margin-top: 25px;
            padding: 12px;
            background-color:blue;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
        }

        @media (max-width: 600px) {
            body {
                background-image: url("https://m.media-amazon.com/images/S/aplus-media-library-service-media/ffd06dce-5656-4550-8d5c-a5798868ad88.__CR0,0,4392,1800_PT0_SX1464_V1___.jpg");
            }

            .login-box {
                width: 80%;
                padding: 20px;
                
            }

             h1 {
                font-size: 28px;
            }
        }

    </style>
</head>
<body>

    <div class="login-box">
        <h1>Login</h1>
        <form>

            <label>Username</label>
            <input type="text" placeholder="Enter your username">
            <label>Password</label>
            <input type="password" placeholder="Enter your password">
            <button>Login</button>
        </form>
    </div>
</body>
</html>
