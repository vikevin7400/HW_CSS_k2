<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>q26</title>

    <style>

        body {
            margin: 0%;
            padding: 40px;

            background: linear-gradient(
                120deg,
                lightblue,
                rgb(107, 107, 255),
                rgb(255, 107, 255),
                rgb(252, 71, 71),
                yellow,
                rgb(130, 255, 130)
            );

            background-size: 400% 900%;
            animation: gd 5s ease infinite;
        }


       

        @keyframes gd {

            0%, 100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

        }



        table {
            box-shadow: 8px 8px 20px black;
            max-width: 1000px;
            width: 100%;
            margin: auto;
            border-collapse: collapse;
            transition: 0.5s;
        }

        table:hover {
            background-color: white;
            transform: translateY(-10px);
            box-shadow: 12px 12px 30px black;
        }

        th {
            padding: 15px;
            background: linear-gradient(
                120deg,
                rgb(123, 123, 255),
                rgb(255, 91, 255),
                pink,
                orange
            );

            background-size: 400% 400%;
            animation: headerAnimation 5s ease infinite;
            color: white;
        }


     

        @keyframes headerAnimation {
            0%, 100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

        }


        td {
            padding: 12px;
            text-align: center;
            text-decoration: underline dotted;
            transition: 0.5s;
        }

        td::before {
            content: "👌 ";
        }

        tbody tr:nth-child(even) {
            background-color: aqua;
        }

        tbody tr:nth-child(odd) {
            background-color: beige;
        }


        td:hover {
            cursor: pointer;
            background-color: yellow;
            transform: scale(1.2);
            box-shadow: 0px 5px 15px black;
        }

    </style>

</head>

<body>

    <div class="cont">

        <table>

            <thead>

                <tr>
                    <th>Sno</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Designation</th>
                    <th>Salary</th>
                </tr>

            </thead>


            <tbody>

                <tr>
                    <td>1</td>
                    <td>Vinayak</td>
                    <td>22</td>
                    <td>Software Developer</td>
                    <td>25000</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Rahul</td>
                    <td>25</td>
                    <td>Web Developer</td>
                    <td>30000</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Amit</td>
                    <td>28</td>
                    <td>Java Developer</td>
                    <td>35000</td>
                </tr>

                <tr>
                    <td>4</td>
                    <td>Rohan</td>
                    <td>30</td>
                    <td>Frontend Developer</td>
                    <td>40000</td>
                </tr>

                <tr>
                    <td>5</td>
                    <td>Shubh</td>
                    <td>27</td>
                    <td>Software Engineer</td>
                    <td>50000</td>
                </tr>

            </tbody>

        </table>

    </div>
</body>
</html>
