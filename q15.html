<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>q15</title>

    <style>

        body {
            margin: 0;
            background-color: white;
            color: black;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color:beige ;
            padding: 20px;
            text-align: center;

        }

         a {
            color: black;
            text-decoration: none;
            margin: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 50px;
        }

        .card {
            background-color: beige;
            color: black;
            width: 200px;
            padding: 20px;
            border-radius: 10px;
        }


       

        @media (prefers-color-scheme: dark) {

            body {
                background-color: #121212;
                color: white;
            }

            nav {
                background-color: #333;
            }

            a {
                color: white;
            }

            .card {
                background-color: #222;
                color: white;
            }

        }

    </style>

</head>

<body>

    
<header>
    <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Services</a>
        <a href="">Contact</a>
    </nav>
</header>
    <h1 style="text-align: center;">
        Welcome to My Website
    </h1>


    <div class="container">

        <div class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
        </div>

    </div>

</body>

</html>
